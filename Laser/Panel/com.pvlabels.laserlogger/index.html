<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Laser Run Logger</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    background: #323232; color: #d6d6d6;
    font: 12px/1.45 "Segoe UI", Tahoma, sans-serif;
    user-select: none;
  }
  h1 { font-size: 13px; margin: 0 0 10px; color: #fff; font-weight: 600; }
  .file { color: #9a9a9a; font-size: 11px; margin-bottom: 10px; word-break: break-all; }
  .row { display: flex; align-items: center; margin-bottom: 6px; gap: 8px; }
  .row label { flex: 0 0 78px; color: #a8a8a8; }
  .row input {
    flex: 1; min-width: 0;
    background: #262626; color: #e8e8e8;
    border: 1px solid #1a1a1a; border-radius: 3px;
    padding: 4px 6px; font: inherit;
  }
  .row input:focus { outline: none; border-color: #4a90d9; }
  .parts-head { margin: 10px 0 4px; color: #a8a8a8; }
  #parts {
    width: 100%; height: 120px; resize: vertical;
    background: #262626; color: #e8e8e8;
    border: 1px solid #1a1a1a; border-radius: 3px;
    padding: 6px; font: 11px/1.5 Consolas, monospace;
  }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1; padding: 7px 0; font: inherit; font-weight: 600;
    border: 1px solid #1a1a1a; border-radius: 3px; cursor: pointer;
    background: #464646; color: #e8e8e8;
  }
  button:hover { background: #525252; }
  #send { background: #2d6bb2; border-color: #245689; color: #fff; }
  #send:hover { background: #3579c4; }
  #send:disabled { background: #3a4a5c; color: #8a97a5; cursor: default; }
  #status { margin-top: 10px; min-height: 30px; font-size: 11px; white-space: pre-wrap; }
  #status.ok { color: #7fd18b; }
  #status.err { color: #e08585; }
  #status.busy { color: #c9b458; }
</style>
</head>
<body>
  <h1>Laser Run Logger</h1>
  <div class="file" id="file">No document scanned yet.</div>

  <div class="row"><label>Laser Run #</label><input id="runNumber"></div>
  <div class="row"><label>Date</label><input id="date"></div>
  <div class="row"><label>Sheets</label><input id="sheets"></div>
  <div class="row"><label>Sheet color</label><input id="sheetType"></div>
  <div class="row"><label>Sheet size</label><input id="size"></div>
  <div class="row"><label>Laser (T#)</label><input id="machine"></div>
  <div class="row"><label>Customer</label><input id="customer"></div>
  <div class="row"><label>Work Order</label><input id="workOrder"></div>

  <div class="parts-head">Part numbers (<span id="partCount">0</span>)</div>
  <textarea id="parts" readonly></textarea>

  <div class="btns">
    <button id="rescan">Rescan</button>
    <button id="send">Send to Sheet</button>
  </div>
  <div id="status"></div>

  <script src="main.js"></script>
</body>
</html>
